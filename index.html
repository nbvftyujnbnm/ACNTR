<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ACNTR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --hud-cyan: #6ff2ff;
        --hud-amber: #ffb038;
        --hud-red: #ff4d3d;
        --hud-dim: rgba(150, 190, 205, 0.55);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05070a; }
      /* Google Fonts is unreachable in the capture sandbox and can fail for
         users too, so every stack ends in a face that actually exists locally.
         Condensed/mono fallbacks keep the technical HUD register rather than
         dropping to a default serif. */
      body {
        font-family: 'Rajdhani', 'Liberation Sans Narrow', 'DejaVu Sans Condensed',
          'Liberation Sans', 'DejaVu Sans', 'Segoe UI', system-ui, sans-serif;
        color: #cfe6ee;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      #app { position: fixed; inset: 0; }
      canvas#viewport { display: block; width: 100%; height: 100%; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #boot {
        position: fixed; inset: 0; z-index: 100;
        display: flex; align-items: center; justify-content: center; flex-direction: column;
        background: radial-gradient(120% 90% at 50% 45%, #0d1319 0%, #04060a 70%);
        transition: opacity 700ms ease;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot .brand {
        font-size: clamp(38px, 9vw, 104px); font-weight: 700; letter-spacing: 0.42em;
        text-indent: 0.42em; color: #e8f6fb;
        text-shadow: 0 0 34px rgba(90, 200, 230, 0.35);
      }
      #boot .sub {
        font-family: 'Share Tech Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-size: 12px; letter-spacing: 0.34em;
        color: var(--hud-dim); margin-top: 14px; text-transform: uppercase;
      }
      #boot .bar { margin-top: 34px; width: min(420px, 62vw); height: 2px; background: rgba(120,170,190,0.16); overflow: hidden; }
      #boot .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #2b7f96, #6ff2ff); transition: width 220ms ease; }
      #boot .status { font-family: 'Share Tech Mono', 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: rgba(140,180,195,0.75); margin-top: 12px; min-height: 14px; }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="viewport"></canvas></div>
    <div id="ui-root"></div>
    <div id="boot">
      <div class="brand">ACNTR</div>
      <div class="sub">Armored Core Network Test Range</div>
      <div class="bar"><i id="boot-bar"></i></div>
      <div class="status" id="boot-status">initializing</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
